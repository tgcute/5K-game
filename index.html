<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五年级｜两可图大挑战</title>
<style>
:root{--bg:#f5f8ff;--card:#fff;--ink:#243047;--line:#dfe5f0;--accent:#5d74d8;--good:#2e9b63;--bad:#d45f67}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#fff7ed);color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 40px}
header{text-align:center;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,44px);margin:6px 0;font-weight:900}
.sub{opacity:.72;line-height:1.7}
.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(45,63,100,.08);padding:22px}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:900}
.progress{height:10px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:12px 0 18px}
.progress>div{height:100%;width:0;background:var(--accent);transition:.25s}
.score{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff}
.art{width:100%;max-width:680px;margin:0 auto 18px;border:2px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.art img{display:block;width:100%;height:auto;max-height:430px;object-fit:contain}
h2{text-align:center;font-size:24px;margin:12px 0 18px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;font-size:18px;font-weight:800;cursor:pointer;transition:.15s}
.option:hover{transform:translateY(-2px);border-color:#9aa7c0}
.option.selected{border-color:var(--accent);background:#eef1ff}
.option.correct{border-color:var(--good);background:#eaf8f0}
.option.wrong{border-color:var(--bad);background:#fff0f1}
.option:disabled{cursor:default;opacity:.95}
.center{text-align:center}
.btn{margin-top:18px;border:0;border-radius:15px;padding:13px 25px;background:var(--accent);color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.feedback{min-height:60px;text-align:center;font-weight:800;line-height:1.7;padding-top:12px}
.rule{background:#f7f9fc;border:1px solid var(--line);padding:12px;border-radius:14px;text-align:center;font-weight:800;margin-bottom:16px}
.final-score{font-size:64px;font-weight:900;text-align:center}
.lesson{background:#fff8dc;border:2px solid #f2d36b;border-radius:18px;padding:18px;line-height:1.8}
@media(max-width:600px){.options{grid-template-columns:1fr}.wrap{padding:14px 10px}.panel{padding:15px}.option{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>🎯 五年级个人线上小游戏</div>
  <h1>👀 两可图大挑战</h1>
  <div class="sub">一幅图，可以看成两个不同的东西。<br><b>前9题：4选2，两个都选对才得1分。</b></div>
</header>

<section id="start" class="panel">
  <h2>🎮 游戏规则</h2>
  <div class="rule">仔细观察 → 从4个选项中选出2个 → 两个都正确才得1分 → 最后第10题思考“两可图带给我们的启示”。</div>
  <div class="center"><button class="btn" onclick="startGame()">开始挑战 🚀</button></div>
</section>

<section id="game" class="panel hide">
  <div class="top"><span id="counter">第1/10题</span><span class="score">🏆 <span id="score">0</span> / 10</span></div>
  <div class="progress"><div id="bar"></div></div>
  <div id="rule" class="rule">请选择 <b>2个答案</b>：两个都选对才有1分。<span id="count">0/2</span></div>
  <div id="art" class="art"></div>
  <h2 id="prompt">这幅图可以看成哪两个？</h2>
  <div id="options" class="options"></div>
  <div class="center"><button id="submit" class="btn" disabled onclick="submitAnswer()">提交答案 ✓</button></div>
  <div id="feedback" class="feedback"></div>
  <div class="center"><button id="next" class="btn hide" onclick="nextQuestion()">下一题 ➜</button></div>
</section>

<section id="result" class="panel hide">
  <h2>🎉 挑战完成！</h2>
  <div class="final-score"><span id="final">0</span><small style="font-size:24px"> / 10</small></div>
  <p id="remark" class="center" style="font-size:20px;font-weight:900"></p>
  <div class="lesson">
    <b>💡 两可图给我们的启示</b><br>
    面对难题时，<b>换个角度去想</b>，我们可能会发现原来没有看见的新方法、新答案。
    有时候，不是问题没有答案，而是我们还没有换一个角度看它。
  </div>
  <div class="center"><button class="btn" onclick="location.reload()">再挑战一次 🔄</button></div>
</section>
</div>

    const b=document.createElement('button');
    b.className='option';
    b.textContent=String.fromCharCode(65+i)+'. '+text;
    b.onclick=()=>toggle(i,b);
    box.appendChild(b);
  });
}

function toggle(i,b){
  if(selected.includes(i)){
    selected=selected.filter(x=>x!==i);
    b.classList.remove('selected');
  } else {
    if(selected.length>=2) return;
    selected.push(i);
    b.classList.add('selected');
  }
  document.getElementById('count').textContent=` ${selected.length} / 2`;
  document.getElementById('submit').disabled=selected.length!==2;
}

function submitAnswer(){
  const q=questions[index];
  const correct=q.answers.map(x=>q.options.indexOf(x)).sort();
  const chosen=[...selected].sort();
  const ok=correct.length===chosen.length && correct.every((v,i)=>v===chosen[i]);
  document.querySelectorAll('.option').forEach((b,i)=>{
    b.disabled=true;
    if(correct.includes(i)) b.classList.add('correct');
    else if(chosen.includes(i)) b.classList.add('wrong');
  });
  if(ok){
    score++;
    document.getElementById('score').textContent=score;
    document.getElementById('feedback').innerHTML='🎉 <b>两个答案都答对了！+1分</b><br>正确答案：'+q.answers.join(' ＋ ');
  } else {
    document.getElementById('feedback').innerHTML='💡 这次没有得分。<br>正确答案：'+q.answers.join(' ＋ ');
  }
  document.getElementById('submit').classList.add('hide');
  document.getElementById('next').classList.remove('hide');
}

function nextQuestion(){
  index++;
  if(index<9) render();
  else if(index===9) renderLesson();
  else finish();
}

function renderLesson(){
  document.getElementById('counter').textContent='第 10 / 10 题';
  document.getElementById('bar').style.width='100%';
  document.getElementById('rule').classList.add('hide');
  document.getElementById('art').classList.add('hide');
  document.getElementById('prompt').textContent='💡 两可图给我们的启示是什么？';
  document.getElementById('submit').classList.add('hide');
  document.getElementById('feedback').textContent='';
  document.getElementById('next').classList.add('hide');
  const opts=[
    '遇到困难就马上放弃。',
    '只用原来的方法，不需要改变。',
    '换个角度去思考，可能会发现新的办法。',
    '等别人替我们解决问题。'
  ];
  const box=document.getElementById('options');
  box.innerHTML='';
  opts.forEach((text,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.textContent=String.fromCharCode(65+i)+'. '+text;
    b.onclick=()=>{
      document.querySelectorAll('.option').forEach(x=>x.disabled=true);
      if(i===2){
        b.classList.add('correct');
        score++;
        document.getElementById('score').textContent=score;
        document.getElementById('feedback').innerHTML='🌟 <b>答对了！+1分</b><br>换一个角度，我们就可能发现新的可能。';
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.option')[2].classList.add('correct');
        document.getElementById('feedback').innerHTML='💡 正确答案是 C。<br>面对难题时，换个角度去想，我们会有新发现。';
      }
      document.getElementById('next').textContent='查看最终成绩 🏆';
      document.getElementById('next').classList.remove('hide');
    };
    box.appendChild(b);
  });
}

function finish(){
  document.getElementById('game').classList.add('hide');
  document.getElementById('result').classList.remove('hide');
  document.getElementById('final').textContent=score;
  document.getElementById('remark').textContent=
    score===10?'🏆 满分！你是“两可图观察大师”！':
    score>=8?'🌟 非常棒！你的观察力和思考力都很强！':
    score>=6?'👍 很不错！继续练习从不同角度思考！':
    '💪 别灰心，再挑战一次，你会发现更多！';
}
</script>
</body>
</html>
